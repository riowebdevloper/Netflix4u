name: Discord Deploy & Update Alert

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Dispatch Discord Deployment Alert
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets['DISCORD_WEBHOOK_URL'] }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'Latest updates deployed to main' }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name || github.actor }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          node scripts/notify_discord.js --event=push
